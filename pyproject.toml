[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoclicker"
dynamic = ["version"]
description = "A simple auto clicker with a GUI for macOS, Windows and Linux (X11/Wayland), plus a Chrome/Edge extension"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Dang Khai" }]
keywords = ["auto clicker", "autoclick", "mouse", "automation", "pyside6"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Utilities",
]
# Each OS only installs what it needs
dependencies = [
    "PySide6-Essentials>=6.6",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "jeepney>=0.8; sys_platform == 'linux'",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0", "pillow>=10"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/khaid2849/auto_clicker"

[project.gui-scripts]
autoclicker = "autoclicker.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "autoclicker.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoclicker = ["browser_extension/*", "browser_extension/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
